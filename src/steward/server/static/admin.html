<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steward admin</title>
<link rel="stylesheet" href="admin/vendor/drawflow.min.css">
<script src="admin/vendor/drawflow.min.js"></script>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2330;--muted:#6b7385;--line:#e2e5ea;--accent:#2f6fec;--ok:#2f9e44;--bad:#e03131;--warn:#f08c00;
  --dec:#8b5cf6;--llm:#2f6fec;--code:#8a92a3;--tool:#0ca678;--out:#e8590c;--sel:#f59f00;--soft:#eef3ff}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--panel:#1a1e26;--ink:#e6e9ef;--muted:#9aa3b5;--line:#2b313d;--soft:#1f2a44}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 6px 0 0}
a{color:var(--accent)}
.btn,.tabs button,select,input,textarea{font:inherit;color:var(--ink)}
.btn,.tabs button{border:1px solid var(--line);background:var(--panel);padding:4px 10px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)} .btn.sm{padding:1px 7px;font-size:12px} .btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:4px;flex-wrap:wrap} .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.chip.draft{border-color:var(--warn);color:var(--warn)} .chip.pub{border-color:var(--ok);color:var(--ok)} .chip.err{border-color:var(--bad);color:var(--bad);cursor:pointer}
.spacer{flex:1}
main{flex:1;min-height:0;overflow:hidden}
.view{display:none;height:100%;overflow:auto;padding:14px} .view.on{display:block}
#v-journeys.on{display:grid;grid-template-columns:230px minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);padding:0;overflow:hidden}
#mainpath{grid-column:1/-1;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:6px;overflow-x:auto}
.stage{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);min-width:120px;font-size:13px}
.stage b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stage.collector{border-color:var(--out);box-shadow:inset 3px 0 0 var(--out)}
.hook{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:92px;padding-top:6px}
.hook .arrow{color:var(--muted);font-size:12px}
.hook .plus{width:24px;height:24px;border-radius:50%;border:1px dashed var(--accent);color:var(--accent);background:var(--panel);cursor:pointer;font-weight:700;line-height:20px}
.hook .jchips{display:flex;flex-direction:column;gap:2px;align-items:center}
.hook .jchip{font-size:11px;padding:1px 6px;border-radius:8px;background:var(--soft);cursor:pointer;white-space:nowrap}
#jlist{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:8px}
.jitem{padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.jitem.on{border-color:var(--accent);background:var(--soft)} .jitem .sub{font-size:11px;color:var(--muted)}
.jitem.off{opacity:.55}
#canvaswrap{position:relative;min-width:0;display:flex;flex-direction:column}
#palette{display:flex;gap:4px;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel);align-items:center}
#drawflow{flex:1;min-height:0;position:relative;background:var(--bg);
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px}
#inspector{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 12px}
#inspector h3{margin:0 0 6px;font-size:14px}
.help{font-size:12px;color:var(--muted);margin:2px 0 8px}
label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 2px}
input[type=text],input[type=number],textarea,select{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
textarea{resize:vertical;min-height:52px}
input[type=checkbox]{width:auto;vertical-align:-2px}
.row{display:flex;gap:6px;align-items:center} .row>*{flex:1} .row>.btn,.row>input[type=checkbox]{flex:0 0 auto}
.errs{border:1px solid var(--bad);border-radius:6px;padding:6px 8px;margin:6px 0;font-size:12px;color:var(--bad)}
/* drawflow theme */
.drawflow .drawflow-node{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);min-width:170px;width:auto;padding:0;box-shadow:0 1px 2px #0001}
.drawflow .drawflow-node.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.drawflow .drawflow-node .input,.drawflow .drawflow-node .output{width:13px;height:13px;border:2px solid var(--muted);background:var(--panel)}
.drawflow .drawflow-node .outputs{display:flex;flex-direction:column;justify-content:center}
.drawflow .drawflow-node .drawflow_content_node{padding-right:34px}
.drawflow .drawflow-node .output{position:relative;margin:7px 0}
.drawflow .drawflow-node .output::after{content:attr(data-port);position:absolute;left:15px;top:-4px;font-size:10px;color:var(--muted);white-space:nowrap}
.drawflow .connection .main-path{stroke:var(--muted);stroke-width:2px}
.drawflow .connection.taken .main-path{stroke:var(--sel);stroke-width:4px}
.drawflow-node.visited{box-shadow:0 0 0 3px var(--sel)!important}
.card{padding:6px 10px;border-left:4px solid var(--code);border-radius:8px}
.card .ct{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.03em}
.card .cid{font-weight:600;font-size:13px}
.card .cs{font-size:11px;color:var(--muted);max-width:180px;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.card .out{font-size:10px;color:var(--out);font-weight:600;margin-top:2px}
.card .ebadge{display:none;font-size:10px;color:#fff;background:var(--bad);border-radius:8px;padding:0 6px;margin-left:4px}
.card.haserr .ebadge{display:inline}
.card .steps{display:none;font-size:10px;color:#000;background:var(--sel);border-radius:8px;padding:0 6px;margin-left:4px}
.visited .card .steps{display:inline}
.t-trigger{border-left-color:var(--dec)}.t-decision{border-left-color:var(--dec)}.t-extract{border-left-color:var(--llm)}
.t-tool{border-left-color:var(--tool)}.t-ask{border-left-color:var(--warn)}.t-emit{border-left-color:var(--out)}.t-end{border-left-color:var(--ink)}
/* lists, tables */
.card2{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card2 h3{margin:0 0 4px;font-size:14px;display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} th{color:var(--muted);font-weight:600}
.pill{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.bad{color:var(--bad);border-color:var(--bad)} .pill.warn{color:var(--warn);border-color:var(--warn)}
.muted{color:var(--muted)} .small{font-size:12px} .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--bg);padding:8px;border-radius:6px;max-height:340px;overflow:auto;margin:4px 0}
.strike{text-decoration:line-through;color:var(--muted)}
/* test chat */
#v-test.on{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px}
#tmsgs{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;height:calc(100vh - 220px)}
.msg{margin:0 0 12px} .msg.user{text-align:right}
.bubble{display:inline-block;text-align:left;padding:8px 11px;border-radius:10px;background:var(--bg);border:1px solid var(--line);max-width:92%;white-space:pre-wrap;word-wrap:break-word}
.msg.user .bubble{background:var(--accent);color:#fff;border-color:var(--accent)}
.tmeta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:50}
#modal .box{background:var(--panel);border-radius:10px;padding:16px;max-width:620px;width:92%;max-height:84vh;overflow:auto}
@media (max-width:900px){#v-journeys.on{grid-template-columns:1fr;grid-template-rows:auto auto 60vh auto;overflow:auto}
  #v-test.on,.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Steward</h1>
  <span id="kbname" class="chip"></span>
  <span id="statechip" class="chip"></span>
  <span id="errchip" class="chip err" style="display:none" onclick="showErrors()"></span>
  <nav class="tabs" id="tabs"></nav>
  <span class="spacer"></span>
  <button class="btn" onclick="validateNow(true)">Validate</button>
  <button class="btn" id="savebtn" onclick="saveDraft()">Save draft</button>
  <button class="btn primary" onclick="publishNow()">Publish</button>
  <select id="moremenu" style="width:auto" onchange="moreAction(this)">
    <option value="">More…</option><option value="discard">Discard draft</option><option value="history">History / restore</option>
    <option value="json">View JSON</option>
  </select>
  
</header>
<main>
  <section class="view" id="v-journeys">
    <div id="mainpath"></div>
    <div id="jlist"></div>
    <div id="canvaswrap"><div id="palette"></div><div id="drawflow"></div></div>
    <div id="inspector"></div>
  </section>
  <section class="view" id="v-policies"></section>
  <section class="view" id="v-rules"></section>
  <section class="view" id="v-templates"></section>
  <section class="view" id="v-prompt"></section>
  <section class="view" id="v-slots"></section>
  <section class="view" id="v-approved"></section>
  <section class="view" id="v-records"></section>
  <section class="view" id="v-test">
    <div><div id="tmsgs"></div>
      <div class="row" style="margin-top:8px"><textarea id="tq" placeholder="Message as a customer… (Enter to send)" style="min-height:44px"></textarea>
        <button class="btn primary" onclick="testSend()">Send</button></div></div>
    <div id="tside"></div>
  </section>
</main>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="modalbox"></div></div>
<script>
// ======================================================================== state
const API = location.pathname.replace(/\/admin\/?$/, "");
let H = null, REV = "", PUBREV = "", DIRTY = false, ERRS = [], CATALOG = {}, UNITS = {}, PROFILE_FIELDS = [], AGENTS = false;
let LANGS = ["en"], KNOWLEDGE_ADMIN = false, curJ = null, editor = null, DF = {}, DFR = {}, loading = false, selNode = null, lastPaths = {}, IS_DRAFT = false;
const TABS = [["journeys","Journeys"],["policies","Policies"],["rules","Rules"],["templates","Templates"],["prompt","Prompt & profile"],
  ["slots","Slots, tools & contacts"],["approved","Approved knowledge"],["records","Records"],["test","Test"]];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
async function api(path, opt = {}) {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opt,
                               body: opt.body && typeof opt.body !== "string" ? JSON.stringify(opt.body) : opt.body});
  const t = await r.text(); let j; try { j = JSON.parse(t) } catch { j = {detail: t} }
  if (!r.ok) throw Object.assign(new Error(j.detail || r.statusText), {status: r.status});
  return j;
}
function toast(msg, bad) {
  const d = document.createElement("div"); d.textContent = msg;
  d.style.cssText = `position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:${bad ? "var(--bad)" : "var(--ink)"};color:var(--panel);padding:8px 14px;border-radius:8px;z-index:60;max-width:80vw`;
  document.body.appendChild(d); setTimeout(() => d.remove(), bad ? 5000 : 2500);
}
function modal(html) { $("#modalbox").innerHTML = html; $("#modal").style.display = "flex"; }
function closeModal() { $("#modal").style.display = "none"; }

// ======================================================================== load / save / validate / publish
async function load() {
  const [g, cat] = await Promise.all([api(API + "/config?draft=1"), api(API + "/catalog")]);
  if (!g.harness) { document.body.innerHTML = `<p style="padding:20px">This knowledge base (${esc(g.kb)}) has no harness_${esc(g.kb)}.json yet.</p>`; return; }
  H = g.harness; REV = g.rev; PUBREV = g.published_rev; IS_DRAFT = g.is_draft; ERRS = g.errors; AGENTS = g.agents_online;
  CATALOG = cat.cards; UNITS = cat.units; PROFILE_FIELDS = cat.profile_fields; LANGS = cat.languages || ["en"]; KNOWLEDGE_ADMIN = !!cat.knowledge_admin;
  for (const k of ["journeys","policies"]) H[k] = H[k] || [];
  for (const k of ["templates","slots","tools","contacts","validators","rules","settings","flow","channels","prompts","profile"]) H[k] = H[k] || {};
  $("#kbname").textContent = "Version " + (g.version ?? "?");
  DIRTY = false; status(); renderAll();
}
function status() {
  const c = $("#statechip");
  if (DIRTY) { c.className = "chip draft"; c.textContent = "Unsaved changes"; }
  else if (IS_DRAFT) { c.className = "chip draft"; c.textContent = `Draft saved (not live) · published v${H.version ?? "?"}`; }
  else { c.className = "chip pub"; c.textContent = `Published v${H.version ?? "?"} · live`; }
  const hard = ERRS.filter(e => e.severity !== "warning");
  const ec = $("#errchip");
  ec.style.display = ERRS.length ? "" : "none";
  ec.textContent = hard.length ? `${hard.length} errors` : `${ERRS.length} warnings`;
  ec.style.color = hard.length ? "var(--bad)" : "var(--warn)"; ec.style.borderColor = ec.style.color;
}
let vTimer = null;
function markDirty(rerenderCanvas) {
  DIRTY = true; status();
  clearTimeout(vTimer); vTimer = setTimeout(() => validateNow(false), 600);
  if (rerenderCanvas) renderCanvas();
}
async function validateNow(show) {
  try { ERRS = (await api(API + "/config/validate", {method: "POST", body: H})).errors; } catch (e) { toast(e.message, true); }
  status(); paintErrors();
  if (show) ERRS.length ? showErrors() : toast("No problems found");
}
function showErrors() {
  modal(`<h3>Validation</h3>` + (ERRS.length ? `<table><tr><th>Where</th><th>Problem</th></tr>` + ERRS.map(e =>
    `<tr><td class="mono">${esc([e.journey, e.node, e.policy, e.template].filter(Boolean).join(" · ") || "config")}</td>
     <td>${e.severity === "warning" ? '<span class="pill warn">warning</span> ' : ""}${esc(e.msg)}</td></tr>`).join("") + `</table>` : "<p>No problems.</p>")
    + `<p><button class="btn" onclick="closeModal()">Close</button></p>`);
}
async function saveDraft() {
  try {
    const r = await api(API + "/config", {method: "PUT", body: {config: H, base_rev: REV}});
    REV = r.rev; ERRS = r.errors; DIRTY = false; IS_DRAFT = true; status(); paintErrors(); toast("Draft saved (not live yet)");
    return true;
  } catch (e) {
    toast(e.status === 409 ? "Someone else saved meanwhile: reload the page (your unsaved edits would be lost)" : e.message, true);
    return false;
  }
}
async function publishNow() {
  if (DIRTY && !(await saveDraft())) return;
  if (!IS_DRAFT) return toast("Nothing to publish: the live configuration has no pending draft");
  await validateNow(false);
  if (ERRS.some(e => e.severity !== "warning")) { showErrors(); return; }
  const note = prompt("Publish the draft to the live assistant. Short note for the history:", "");
  if (note === null) return;
  try { const r = await api(API + "/config/publish", {method: "POST", body: {note}}); toast(`Published v${r.version}`); await load(); }
  catch (e) { toast(e.message, true); }
}
async function moreAction(sel) {
  const v = sel.value; sel.value = "";
  if (v === "discard") {
    if (!confirm("Discard the draft and all unsaved changes, and go back to the live configuration?")) return;
    await api(API + "/config/discard", {method: "POST"}); await load(); toast("Draft discarded");
  } else if (v === "history") {
    const h = (await api(API + "/config/history")).history;
    modal(`<h3>Published versions</h3><p class="help">Restoring copies an older version into the draft; publish it to make it live.</p>` +
      (h.length ? `<table><tr><th>Version</th><th>Replaced</th><th>Note</th><th></th></tr>` + h.map(x =>
        `<tr><td>v${x.version}</td><td>${new Date(x.ts * 1000).toLocaleString()}</td><td>${esc(x.note)}</td>
         <td><button class="btn sm" onclick="restoreVersion(${x.id})">Restore to draft</button></td></tr>`).join("") + `</table>` : "<p class='muted'>No earlier versions yet (each publish keeps the one it replaces).</p>")
      + `<p><button class="btn" onclick="closeModal()">Close</button></p>`);
  } else if (v === "json") {
    modal(`<h3>Configuration JSON (working copy)</h3><pre>${esc(JSON.stringify(H, null, 1))}</pre><p><button class="btn" onclick="closeModal()">Close</button></p>`);
  }
}
async function restoreVersion(id) {
  if (DIRTY && !confirm("You have unsaved changes; restoring replaces the draft. Continue?")) return;
  await api(API + "/config/restore", {method: "POST", body: {id}}); closeModal(); await load(); toast("Restored into the draft");
}
window.addEventListener("beforeunload", e => { if (DIRTY) { e.preventDefault(); e.returnValue = ""; } });

// ======================================================================== small form helpers (bound to objects)
function inp(obj, key, opt = {}) { return `<div class="fld">${inpRaw(obj, key, opt)}</div>`; }
function inpRaw(obj, key, opt) {          // text / number / textarea / select / checkbox bound to obj[key]
  const id = "f" + Math.random().toString(36).slice(2);
  setTimeout(() => {
    const e = document.getElementById(id); if (!e) return;
    const ev = opt.type === "checkbox" || e.tagName === "SELECT" ? "change" : "input";
    e.addEventListener(ev, () => {
      let v = opt.type === "checkbox" ? e.checked : e.value;
      if (opt.type === "number") v = v === "" ? undefined : Number(v);
      if (opt.list) v = v.split(opt.list === "lines" ? "\n" : ",").map(s => s.trim()).filter(Boolean);
      if (v === "" || v === undefined) { if (opt.keepEmpty) obj[key] = ""; else delete obj[key]; } else obj[key] = v;
      opt.onchange && opt.onchange(v);
      markDirty(opt.canvas);
    });
  });
  let val = obj[key] ?? opt.dflt;
  if (opt.list && Array.isArray(val)) val = val.join(opt.list === "lines" ? "\n" : ", ");
  const lab = opt.label ? `<label class="f" for="${id}">${esc(opt.label)}</label>` : "";
  if (opt.type === "checkbox") return `<label class="f"><input id="${id}" type="checkbox" ${val ? "checked" : ""}> ${esc(opt.label || key)}</label>`;
  if (opt.options) return lab + `<select id="${id}">` + opt.options.map(o => {
      const [v, t] = Array.isArray(o) ? o : [o, o === "" ? "(none)" : o];
      return `<option value="${esc(v)}" ${String(val ?? "") === String(v) ? "selected" : ""}>${esc(t)}</option>`; }).join("") + `</select>`;
  if (opt.type === "textarea" || opt.list === "lines") return lab + `<textarea id="${id}" rows="${opt.rows || 3}" placeholder="${esc(opt.ph || "")}">${esc(val ?? "")}</textarea>`;
  return lab + `<input id="${id}" type="${opt.type === "number" ? "number" : "text"}" ${opt.step ? `step="${opt.step}"` : ""} value="${esc(val ?? "")}" placeholder="${esc(opt.ph || "")}" class="${opt.mono ? "mono" : ""}">`;
}
const tplOptions = (none = true) => (none ? [""] : []).concat(Object.keys(H.templates).sort());
const toolOptions = () => [""].concat(Object.keys(H.tools));

// ======================================================================== tabs
function renderTabs() {
  $("#tabs").innerHTML = TABS.filter(([k]) => k !== "approved" || KNOWLEDGE_ADMIN).map(([k, t]) => `<button data-t="${k}" onclick="showTab('${k}')">${t}</button>`).join("");
}
function showTab(k) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + k));
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === k));
  try { localStorage.setItem("harness_tab", k); } catch {}
  ({journeys: renderJourneys, policies: renderPolicies, rules: renderRules, templates: renderTemplates, prompt: renderPrompt,
    slots: renderSlots, approved: renderApproved, records: renderRecords, test: renderTest})[k]();
}
function renderAll() {
  renderTabs();
  let k = "journeys"; try { k = localStorage.getItem("harness_tab") || k; } catch {}
  if (location.hash.length > 1) {  // #tab or #journeys:<journey id>
    const [t, jid] = location.hash.slice(1).split(":"); k = t;
    if (jid) curJ = H.journeys.find(j => j.id === jid) || null;
  }
  showTab(TABS.some(t => t[0] === k) ? k : "journeys");
}

// ======================================================================== journeys: main path + list
const trig = j => (j.nodes || []).find(n => n.type === "trigger") || {};
function renderJourneys() {
  if (!curJ || !H.journeys.includes(curJ)) curJ = H.journeys[0] || null;
  renderMainPath(); renderJList(); renderPalette(); initEditor(); renderCanvas();
}
function renderMainPath() {
  const chips = scope => H.journeys.filter(j => (trig(j).scope || "part") === scope).map(j =>
    `<span class="jchip" style="${j.enabled === false ? "opacity:.5" : ""}" onclick="selectJourney('${esc(j.id)}')">${esc(j.title || j.id)}</span>`).join("")
    + `<span class="muted small">${H.policies.filter(p => (p.scope || "part") === scope).length} policies</span>`;
  const hook = (scope, label) => `<div class="hook"><span class="arrow">→ ${label} →</span>

    case "condition": return n.expr || "(no expression)";
    case "decision": return (n.decision || {}).instructions || "(no question)";
    case "extract": return `${(n.slots || []).join(", ") || "(no slots)"} from ${n.source || "conversation"}`;
    case "tool": return (n.tool || "(no tool)") + (n.save_as ? " → " + n.save_as : "");
    case "ask": return `${n.template || "(no template)"} · needs ${(n.require || []).join(", ")}`;
    case "set": return Object.entries(n.assign || {}).map(([k, v]) => `${k} = ${v}`).join("; ") || "(nothing)";

    <div class="cid">${esc(n.id)}</div><div class="cs">${esc(summary(n))}</div>

    case "set":

        `<div class="row" style="margin-bottom:4px"><input type="text" class="mono" value="${esc(k)}" onchange="renameAssign('${esc(k)}',this.value)">

  }

let tplFilter = "all", tplSearch = "";
const isApproved = (t, lg) => t.approved === undefined ? true : typeof t.approved === "object" ? t.approved[lg] !== false : !!t.approved;
function usage(tid) {
  const u = [];
  for (const j of H.journeys) for (const n of j.nodes) if (n.template === tid) u.push(`${j.id}.${n.id}`);
  for (const p of H.policies) if ((p.action || {}).template === tid) u.push("policy " + p.id);
  for (const [k, v] of Object.entries(H.flow)) if (v && Object.values(v).includes(tid)) u.push("flow " + k);
  if (H.channels.comment?.template === tid) u.push("comment channel"); if (H.settings.paused_template === tid) u.push("paused");

}

      return `<div class="card2"><h3><span class="mono">${esc(id)}</span>${langs.map(lg => `<span class="pill ${isApproved(t, lg) ? "ok" : "warn"}">${lg} ${isApproved(t, lg) ? "approved" : "needs review"}</span>`).join("")}

          ${inp(t, "covers", {list: ",", label: "Makes these redundant (ids)"})}${inp(t, "counts_as_ask", {label: "Counts as asking for", options: ["", ...Object.keys(H.slots)]})}</div></div>`; }).join("");

      <textarea id="apptext" class="mono" rows="24">${esc(APP.text)}</textarea>
      <div class="row" style="margin-top:6px"><button class="btn" onclick="saveApproved()">Save file</button>
        <button class="btn primary" id="buildbtn" onclick="buildApproved()" ${b.running ? "disabled" : ""}>${b.running ? "Building…" : "Rebuild approved knowledge"}</button>
        <span class="muted small">KB ${esc(APP.kb_version)} · ${APP.approved.length} approved sections</span></div>
      ${b.error ? `<div class="errs">${esc(b.error)}</div>` : ""}${b.log ? `<details ${b.running ? "open" : ""}><summary>Last build log</summary><pre>${esc(b.log)}</pre></details>` : ""}
    </div><div class="card2"><h3>Source lines replaced by approved information</h3>
      <p class="help">Found automatically (decision model → LLM with evidence → decision model per line). Outdated lines are removed from the source text before the assistant sees it. Reject a wrong mark, or mark a line by hand.</p>
      <table><tr><th>Source section · outdated line</th><th>Contradicted by (approved)</th><th></th></tr>${APP.marks.map(m => `<tr>
        <td><span class="mono small">${esc(m.unit)}</span> ${esc(m.unit_title)}<div class="${m.rejected ? "" : "strike"}">${esc(m.line)}</div>
          ${m.rejected ? '<span class="pill ok">kept (rejected mark)</span>' : '<span class="pill warn">removed</span>'} ${m.manual ? '<span class="pill">by admin</span>' : ""}</td>
        <td><span class="mono small">${esc(m.by)}</span> ${esc(m.by_title)}<div class="muted small">${esc(m.evidence)}</div><div class="muted small"><i>${esc(m.why)}</i></div></td>
        <td>${m.manual ? `<button class="btn sm" onclick="markLine('${esc(m.unit)}',${JSON.stringify(m.line).replace(/"/g, "&quot;")},'clear')">Remove mark</button>` :
          m.rejected ? `<button class="btn sm" onclick="markLine('${esc(m.unit)}',${JSON.stringify(m.line).replace(/"/g, "&quot;")},'clear')">Undo</button>` :
          `<button class="btn sm danger" onclick="markLine('${esc(m.unit)}',${JSON.stringify(m.line).replace(/"/g, "&quot;")},'reject')">Reject</button>`}</td></tr>`).join("")
        || '<tr><td colspan="3" class="muted">No conflicts found.</td></tr>'}</table>
      <h3 style="margin-top:14px">Mark a source line as outdated</h3>
      <select id="mk-unit" onchange="loadLines(this.value)"><option value="">Source section…</option>${APP.sources.map(u => `<option value="${esc(u.id)}">${esc(u.id)} · ${esc(u.title)}</option>`).join("")}</select>
      <select id="mk-line" style="margin-top:4px"></select>
      <select id="mk-by" style="margin-top:4px"><option value="">Replaced by approved section…</option>${APP.approved.map(u => `<option value="${esc(u.id)}">${esc(u.id)} · ${esc(u.title)}</option>`).join("")}</select>
      <button class="btn" style="margin-top:6px" onclick="addMark()">Mark outdated</button>
    </div></div>`;
  if (b.running) { clearTimeout(buildTimer); buildTimer = setTimeout(() => { if ($("#v-approved").classList.contains("on")) renderApproved(); }, 3000); }
}
async function saveApproved() { try { await api(API + "/knowledge/approved", {method: "PUT", body: {text: $("#apptext").value}}); toast("Saved. Click Rebuild to load it into the knowledge base."); } catch (e) { toast(e.message, true); } }
async function buildApproved() {
  if (!confirm("Rebuild the approved knowledge now? Paid LLM calls (≈ $0.01 if the file changed, ≈ $0 if not). The file is saved first.")) return;
  try { await api(API + "/knowledge/approved", {method: "PUT", body: {text: $("#apptext").value}}); await api(API + "/knowledge/approved/build", {method: "POST"}); renderApproved(); }
  catch (e) { toast(e.message, true); }
}
async function markLine(unit, line, action) { try { await api(API + "/knowledge/mark", {method: "POST", body: {unit, line, action}}); renderApproved(); } catch (e) { toast(e.message, true); } }
async function loadLines(uid) {
  const s = $("#mk-line"); s.innerHTML = ""; if (!uid) return;
  const u = await api(API + "/knowledge/section/" + encodeURIComponent(uid));
  s.innerHTML = u.lines.map(l => `<option value="${esc(l)}">${u.outdated.includes(l) ? "[removed] " : ""}${esc(l.slice(0, 140))}</option>`).join("");
}
async function addMark() {
  const unit = $("#mk-unit").value, line = $("#mk-line").value, by = $("#mk-by").value;
  if (!unit || !line || !by) return toast("Choose the section, the line and the approved section", true);
  try { await api(API + "/knowledge/mark", {method: "POST", body: {unit, line, action: "add", by}}); renderApproved(); toast("Marked"); } catch (e) { toast(e.message, true); }
}

// ======================================================================== records
async function renderRecords() {
  const v = $("#v-records"); v.innerHTML = `<p class="muted">Loading…</p>`;
  const recs = (await api(API + "/records")).records;
  const by = {}; for (const r of recs) (by[r.type] = by[r.type] || []).push(r);
  const types = Object.keys(by).length ? Object.keys(by) : ["lead", "handover"];
  v.innerHTML = `<p class="help">Records written by tools (test sessions are excluded). Host systems receive them through the <span class="mono">record</span> event too.</p>` +
    types.map(t => { const rows = by[t] || [], keys = [...new Set(rows.flatMap(r => Object.keys(r.data)))];
      return `<div class="card2"><h3>${esc(t)}s (${rows.length}) <span class="spacer"></span><a class="btn sm" href="${API}/records.csv?type=${encodeURIComponent(t)}">CSV</a></h3>
        ${rows.length ? `<div style="overflow:auto"><table><tr><th>When</th><th>Session</th>${keys.map(k => `<th>${esc(k)}</th>`).join("")}</tr>` +
        rows.map(r => `<tr><td>${new Date(r.ts * 1000).toLocaleString()}</td><td class="mono">${esc(r.session.split(":").pop())}</td>${keys.map(k => `<td>${esc(r.data[k])}</td>`).join("")}</tr>`).join("") + `</table></div>` : '<p class="muted">None yet.</p>'}</div>`; }).join("");
}

// ======================================================================== test panel (runs the draft or the live config)
let tSession = "test_" + Math.random().toString(36).slice(2, 8), tHarness = "draft", tChannel = "dm";
function renderTest() {
  $("#tside").innerHTML = `<div class="card2"><h3>Test settings</h3>
    <label class="f">Configuration</label><select onchange="tHarness=this.value"><option value="draft" ${tHarness === "draft" ? "selected" : ""}>Draft (your edits; saved automatically before sending)</option><option value="published" ${tHarness === "published" ? "selected" : ""}>Published (live)</option></select>
    <label class="f">Channel</label><select onchange="tChannel=this.value"><option value="dm">Inbox (DM)</option><option value="comment" ${tChannel === "comment" ? "selected" : ""}>Public comment</option></select>
    <label class="f"><input type="checkbox" ${AGENTS ? "checked" : ""} onchange="setAgents(this.checked)"> Human agents online (live setting)</label>
    <p class="row"><button class="btn" onclick="newTestSession()">New conversation</button><button class="btn" onclick="releaseTest()">Release handover</button></p>
    <p class="help">Session <span class="mono">${tSession}</span>. Test sessions never reach the lead file. Each message costs about $0.001.</p></div>
    <div class="card2" id="tstate"><h3>Session state</h3><p class="muted small">Send a message.</p></div>`;
  $("#tq").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); testSend(); } };
}
async function setAgents(on) { await api(API + "/runtime/agents", {method: "POST", body: {online: on}}); AGENTS = on; }
async function newTestSession() { tSession = "test_" + Math.random().toString(36).slice(2, 8); $("#tmsgs").innerHTML = ""; renderTest(); }
async function releaseTest() { await api(API + "/sessions/" + encodeURIComponent(tSession) + "/release", {method: "POST"}); toast("Released: the bot answers again"); }
async function testSend() {
  const q = $("#tq").value.trim(); if (!q) return;
  if (tHarness === "draft" && DIRTY && !(await saveDraft())) return;
  $("#tq").value = "";
  const box = $("#tmsgs");
  box.insertAdjacentHTML("beforeend", `<div class="msg user"><div class="bubble">${esc(q)}</div></div><div class="msg" id="pending"><div class="bubble muted">…</div></div>`);
  box.scrollTop = box.scrollHeight;
  try {
    const r = await api(API + "/chat", {method: "POST", body: {text: q, session: tSession, channel: tChannel, config: tHarness, is_test: true}});
    $("#pending").remove();
    const js = (r.harness || {}).journeys || [], pol = (r.harness || {}).policies || [];
    js.forEach(o => lastPaths[o.journey] = o.path);
    box.insertAdjacentHTML("beforeend", `<div class="msg"><div class="bubble">${esc(r.answer)}</div><div class="tmeta">
      <span class="pill">${esc(r.status)}</span><span>$${(r.totals?.cost_usd || 0).toFixed(4)}</span><span>${Math.round((r.totals?.latency_ms || 0) / 100) / 10}s</span>
      ${js.map(o => `<button class="btn sm" title="${esc(o.path.map(p => p.node + (p.port ? "." + p.port : "")).join(" → "))}" onclick="showOnCanvas('${esc(o.journey)}')">${esc(o.journey)}: ${esc(o.status)} ↗</button>`).join("")}
      ${pol.map(p => `<span class="pill">policy ${esc(p)}</span>`).join("")}</div></div>`);
    box.scrollTop = box.scrollHeight;
    const st = r.state || {};
    $("#tstate").innerHTML = `<h3>Session state</h3><table>${Object.entries(st.slots || {}).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}
      ${Object.entries(st.flags || {}).map(([k, v]) => `<tr><th class="muted">${esc(k)}</th><td class="muted">${esc(JSON.stringify(v))}</td></tr>`).join("")}</table>
      ${st.pending ? `<p class="small">Waiting for: <b>${esc((st.pending.require || []).join(", "))}</b> (${esc(st.pending.journey)})</p>` : ""}`;
  } catch (e) { $("#pending")?.remove(); box.insertAdjacentHTML("beforeend", `<div class="errs">${esc(e.message)}</div>`); }
}
function showOnCanvas(jid) {
  const j = H.journeys.find(x => x.id === jid); if (!j) return toast("That journey is not in the working copy", true);
  curJ = j; selNode = null; showTab("journeys");
}

load().catch(e => { document.body.insertAdjacentHTML("afterbegin", `<div class="errs" style="margin:10px">${esc(e.message)}</div>`); });
</script>
</body>
</html>
