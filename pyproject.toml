[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "steward-harness"
version = "0.1.0.dev0"
description = "Steward: a compliant customer-service harness, powered by DADR (decision-guided retrieval)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Tharusha Udana" }]
keywords = ["chatbot", "customer service", "retrieval", "rag", "agents", "harness", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
mongo = ["pymongo>=4.9"]
firestore = ["google-cloud-firestore>=2.16"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.scripts]
steward = "steward.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/steward"]

[tool.hatch.build.targets.sdist]
exclude = ["demo", "runs", "*.db"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src/steward"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
